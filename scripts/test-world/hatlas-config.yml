# Hatlas config.yml for the in-game test server (copied by scripts/test-server.ps1 rebuild-from-map).
# Only the keys that differ from the shipped defaults; Hatlas adds the rest on first start.
# PostgreSQL in docker (test-server.ps1 db-up); the password comes from HATLAS_DB_PASSWORD.
storage:
  type: postgresql
  autosave_minutes: 5
  postgresql:
    host: localhost
    port: 5432
    database: hatlas_test
    username: hatlas
    password: ''
    ssl: false
# Bots wait a lot during scenarios: never kick them for being AFK.
afk:
  timeout_seconds: 86400
