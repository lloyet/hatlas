# Atlas config.yml for the in-game test server (copied by scripts/test-server.ps1 rebuild-from-map).
# Only the keys that differ from the shipped defaults; Atlas adds the rest on first start.
# PostgreSQL in docker (test-server.ps1 db-up); the password comes from ATLAS_DB_PASSWORD.
storage:
  type: postgresql
  autosave_minutes: 5
  postgresql:
    host: localhost
    port: 5432
    database: atlas_test
    username: atlas
    password: ''
    ssl: false
# Bots wait a lot during scenarios: never kick them for being AFK.
afk:
  timeout_seconds: 86400
