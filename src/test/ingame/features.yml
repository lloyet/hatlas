# Feature → files map for the in-game test suites (src/test/ingame/<feature>/*.json).
#
# A change runs the suites of every feature whose globs match a changed file
# (resolved by .claude/hooks/affected-features.mjs). Matching is per feature, not per
# scenario (Open Question 17): when a feature is touched, all its scenarios run.
#
# Glob syntax: `**` = any number of directories, `*` = anything except `/`, `?` = one char.
# Paths are relative to the repository root.

# Files that every feature depends on: touching one runs ALL suites.
shared:
  - src/main/java/org/minecraft/hatlas/Hatlas.java
  - src/main/java/org/minecraft/hatlas/HatlasLoader.java
  - src/main/java/org/minecraft/hatlas/util/**
  - src/main/java/org/minecraft/hatlas/gui/HatlasGui.java
  - src/main/java/org/minecraft/hatlas/gui/GuiNavigator.java
  - src/main/java/org/minecraft/hatlas/listener/GuiListener.java
  - src/main/resources/paper-plugin.yml
  - src/main/resources/config.yml
  - src/test/ingame/fixtures.json
  - build.gradle*
  - settings.gradle*

