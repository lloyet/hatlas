name: hatlas
version: '$version'
main: org.minecraft.hatlas.Hatlas
# Adds the PostgreSQL JDBC driver to the classpath when config.yml storage.type is postgresql.
loader: org.minecraft.hatlas.HatlasLoader
api-version: '1.21'
load: POSTWORLD

# packetevents must load before us (locator-bar filter registers against its API) and
# share its classes with our isolated Paper-plugin classloader.
dependencies:
  server:
    packetevents:
      load: BEFORE
      required: true
      join-classpath: true

permissions:
  hatlas.storage.admin:
    description: /hatlas storage info|export (full data backup to a portable SQLite file)
    default: op
  hatlas.quest:
    description: Access to /quest
    default: true
  hatlas.job:
    description: Access to /job
    default: true
  hatlas.job.admin:
    description: Admin access to /job remove, /job set, and /job level management
    default: op
  hatlas.faction:
    description: Access to /faction help
    default: true
  hatlas.faction.create:
    description: Create a faction
    default: true
  hatlas.faction.invite:
    description: Invite players to a faction
    default: true
  hatlas.faction.accept:
    description: Accept faction invitations
    default: true
  hatlas.faction.decline:
    description: Decline faction invitations
    default: true
  hatlas.faction.rename:
    description: Rename a faction
    default: true
  hatlas.faction.kick:
    description: Kick members from a faction
    default: true
  hatlas.faction.disband:
    description: Disband a faction
    default: true
  hatlas.faction.transfer:
    description: Transfer faction ownership
    default: true
  hatlas.faction.info:
    description: View faction information
    default: true
  hatlas.faction.color:
    description: Change faction color
    default: true
  hatlas.faction.leave:
    description: Leave a faction
    default: true
  hatlas.faction.list:
    description: List all factions
    default: true
  hatlas.faction.members:
    description: List members of your faction
    default: true
  hatlas.faction.description:
    description: View or set the faction description
    default: true
  hatlas.faction.promote:
    description: Promote a faction member to the next role
    default: true
  hatlas.faction.demote:
    description: Demote a faction member to the previous role
    default: true
  hatlas.faction.home:
    description: Teleport to the faction home
    default: true
  hatlas.faction.sethome:
    description: Set the home location for a faction crystal (leader/owner only)
    default: true
  hatlas.faction.upgrade:
    description: Apply upgrade bonuses to Hatlas Crystals (owner/leader)
    default: true
  hatlas.faction.debug:
    description: Debug commands - /faction level set, /faction exp set/add
    default: op
  hatlas.faction.admin.disband:
    description: Administratively disband any faction by name
    default: op
  hatlas.faction.admin.join:
    description: Force-join any player into any faction without invitation
    default: op
  hatlas.crystal:
    description: Access to /crystal commands
    default: true
  hatlas.crystal.list:
    description: List faction crystals
    default: true
  hatlas.crystal.rename:
    description: Rename a faction crystal
    default: true
  hatlas.donjon.admin:
    description: Create, delete, activate, and reset donjons via /donjon
    default: op
  hatlas.tag.admin:
    description: Full access to /tag (create, delete, add, edit, list)
    default: op
  hatlas.rtp:
    description: Randomly teleport within the configured radius around spawn
    default: true
  hatlas.spawn:
    description: Teleport to world spawn with a 10-second countdown
    default: true
  hatlas.spawn.admin:
    description: Teleport to any safe zone with /spawn <name>, and set the world spawn with /spawn set
    default: op
  hatlas.safezone.admin:
    description: Create and manage safe zones via /safezone
    default: op
  hatlas.safezone.tp:
    description: Teleport to a safe zone's spawn via /safezone tp <name>
    default: true
  hatlas.tpa:
    description: Send and respond to teleport-to-player requests
    default: true
  hatlas.home:
    description: Teleport to your personal home
    default: true
  hatlas.home.set:
    description: Set your personal home with /sethome
    default: true
  hatlas.home.delete:
    description: Delete a named home with /delhome
    default: true
  hatlas.faction.msg:
    description: Send a message to all online faction members
    default: true
  hatlas.faction.ally:
    description: Manage faction alliances (leader/owner only)
    default: true
  hatlas.faction.outpost:
    description: Create a faction outpost (leader/owner only)
    default: true
  hatlas.faction.claim:
    description: Claim the chunk you are standing in
    default: true
  hatlas.faction.unclaim:
    description: Unclaim a chunk (owner/leader only)
    default: true
  hatlas.faction.balance:
    description: Show the ruby-gem balance of your faction's vault
    default: true
  hatlas.item.admin:
    description: Give Hatlas custom items (ruby and amethyst) via /item give <player> <item> [amount]
    default: op
  hatlas.auction:
    description: Use the auction system (sell, browse market, view own listings)
    default: true
  hatlas.auction.npc:
    description: Spawn the auctioneer NPC via /auction npc spawn
    default: op
  hatlas.orezone.admin:
    description: Manage ore zones via /orezone (pos1, pos2, add, remove, reset, list)
    default: op
  hatlas.shop.admin:
    description: Manage job shops via /shop (create, delete, list, additem, reset)
    default: op
