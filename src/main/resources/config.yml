# Hatlas plugin configuration
# See also: homes.yml, safezones.yml, combats.yml, factions.yml, donjons.yml, jobs.yml, shops.yml

# Where runtime data is stored (factions, crystals, jobs, donjons, homes, shops, …).
# Tuning stays in the .yml files; only runtime data goes here. Changing the type needs a restart.
storage:
  # postgresql = PostgreSQL server (default, used in production; shares data with the website).
  #              Hatlas does not start without its database: see storage.postgresql below.
  # sqlite     = one local database file, for a development server without PostgreSQL.
  # Choose once: there is no migration between sqlite and postgresql. Back up the database
  # with its own tools (pg_dump), together with the world.
  # Legacy *-data.yml files (old yaml storage, no longer supported) are imported once on the
  # first start and renamed to *.yml.migrated (kept as backup).
  type: postgresql
  # Every domain is saved at this interval, in addition to saves right after important actions.
  autosave_minutes: 5
  sqlite:
    # Relative to plugins/hatlas/
    file: hatlas.db
  postgresql:
    host: localhost
    port: 5432
    database: hatlas
    username: hatlas
    # Prefer the HATLAS_DB_PASSWORD environment variable (it overrides this value).
    password: ''
    ssl: false

# Teleport-to-player settings for /tpa
tpa:
  # Countdown delay in seconds before the requester is teleported after acceptance. Op bypasses.
  teleport_delay_seconds: 10
  # Cooldown in seconds after a completed /tpa teleport
  cooldown_seconds: 60

# Random teleport settings for /air tp
random_teleport:
  # Countdown delay in seconds before the player is teleported. Op bypasses.
  teleport_delay_seconds: 10
  # Cooldown in seconds between uses
  cooldown_seconds: 30
  # Maximum distance in blocks from world spawn for the random destination
  radius: 1024

# AFK auto-disconnect settings
afk:
  # Seconds of inactivity before a player is kicked
  timeout_seconds: 300

# Death-based teleport penalty cooldown (applies to /home, /f home, /tpa — not /spawn)
death_teleport_cooldown:
  # Base cooldown in seconds after the first death.
  base_seconds: 10
  # Escalation multiplier applied on each death within the active escalation window.
  # Also the value the multiplier resets to when the window expires.
  multiplier: 2

# Amethyst gear (/item give … amethyst_*): bonus over the vanilla base item (netherite, or
# trident for the spear) applied to attack damage, armor, armor toughness, knockback
# resistance, mining speed and durability. Attack speed is unchanged. Only items crafted or
# given after a restart get a new value.
amethyst:
  stat_bonus_percent: 15

# hatlas resource pack — pushed to every joining player via Player#sendResourcePacks
resourcepack:
  # Direct download URL of the .zip (must be reachable from the client)
  url: "https://example.com/hatlas.zip"
  # 40-character lowercase SHA-1 of the .zip — clients refuse mismatched hashes
  sha1: "0000000000000000000000000000000000000000"
  # If true, the client is kicked when they decline or fail to download
  required: false
  # Prompt shown in the accept dialog (plain text)
  prompt: "Please accept the Hatlas resource pack to see custom items."
